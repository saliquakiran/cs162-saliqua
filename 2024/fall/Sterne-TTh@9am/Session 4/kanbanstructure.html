<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="kanbanstyle.css">
</head>
<body>
    <header>
        <h1>Kanban Board</h1>
        <a href="#" class="logout">Logout</a>
    </header>

    <main>
        <div class="kanban-board">
            <div class="column">
                <h2>Backlog</h2>
                <ul>
                    <li>Task 1</li>
                    <li>Task 2</li>
                </ul>
            </div>
            <div class="column">
                <h2>To Do</h2>
                <ul>
                    <li>Task 3</li>
                    <li>Task 4</li>
                </ul>
            </div>
            <div class="column">
                <h2>In Progress</h2>
                <ul>
                    <li>Task 5</li>
                    <li>Task 6</li>
                </ul>
            </div>
            <div class="column">
                <h2>Review</h2>
                <ul>
                    <li>Task 7</li>
                    <li>Task 8</li>
                </ul>
            </div>
            <div class="column">
                <h2>Done</h2>
                <ul>
                    <li>Task 9</li>
                    <li>Task 10</li>
                </ul>
            </div>
        </div>
    </main>

    <footer>
        <p>Kanban Board - Project Management Tool © 2024</p>
    </footer>
</body>
</html>
